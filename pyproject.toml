[project]
name = "ai-act-compliance-agent"
version = "0.1.0"
description = "Multi-agent system that audits AI systems against the EU AI Act"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_act_agent"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
